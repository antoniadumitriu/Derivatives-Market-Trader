name: Fundamentals daily

on:
  schedule:
    # 13:17 UTC every day, after the day-ahead auction results (about 12:45 CET).
    # GitHub cron runs in UTC and can start late.
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "Backfill from this date (YYYY-MM-DD). Leave blank for the normal daily lookback."
        required: false
        default: ""
      connectors:
        description: "Which connectors to run"
        type: choice
        options: [all, energy_charts, open_meteo, yahoo]
        default: all

permissions:
  contents: read  # data is pushed to the private data repo with DATA_REPO_TOKEN, not to this repo

concurrency:
  group: fundamentals
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DMT_DATA_DIR: ${{ github.workspace }}/data-repo  # where connectors read and write data
      PYTHONUNBUFFERED: "1"  # show progress in the log as it happens
      START: ${{ inputs.start }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/derivatives-market-data
          token: ${{ secrets.DATA_REPO_TOKEN }}  # fine-grained token, contents read/write on the data repo
          path: data-repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "pandas>=2.2" "requests>=2.31"

      - name: Energy-Charts (prices, generation, forecasts, flows, capacity)
        id: energy_charts
        if: inputs.connectors != 'open_meteo' && inputs.connectors != 'yahoo'
        continue-on-error: true
        run: python -m connectors.energy_charts.fetch ${START:+--start "$START"}

      - name: Open-Meteo (weather actuals and forecasts)
        id: open_meteo
        if: inputs.connectors != 'energy_charts' && inputs.connectors != 'yahoo'
        continue-on-error: true
        run: python -m connectors.open_meteo.fetch ${START:+--start "$START"}

      - name: Yahoo Finance (TTF gas, carbon proxy, EUR/USD)
        id: yahoo
        if: inputs.connectors != 'energy_charts' && inputs.connectors != 'open_meteo'
        continue-on-error: true
        run: python -m connectors.yahoo.fetch ${START:+--start "$START"}

      - name: Commit new data
        if: always()
        run: .github/scripts/commit-data.sh "Fundamentals $(date -u +%F)"

      - name: Fail the run if a connector failed
        if: steps.energy_charts.outcome == 'failure' || steps.open_meteo.outcome == 'failure' || steps.yahoo.outcome == 'failure'
        run: |
          echo "Energy-Charts: ${{ steps.energy_charts.outcome }}, Open-Meteo: ${{ steps.open_meteo.outcome }}, Yahoo: ${{ steps.yahoo.outcome }}"
          exit 1
