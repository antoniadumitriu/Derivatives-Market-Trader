name: EEX daily settlements

on:
  schedule:
    # 19:37 UTC (20:37 CET), Monday to Friday, after EEX publishes settlements.
    # GitHub cron runs in UTC and can start a few minutes late.
    - cron: "37 19 * * 1-5"
  workflow_dispatch:  # adds a "Run workflow" button for manual runs
    inputs:
      catalog_only:
        description: "Only refresh eex/catalog_summary.csv in the data repo (fast), no settlements"
        type: boolean
        default: false

permissions:
  contents: read  # data is pushed to the private data repo with DATA_REPO_TOKEN, not to this repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DMT_DATA_DIR: ${{ github.workspace }}/data-repo  # where connectors read and write data
      PYTHONUNBUFFERED: "1"  # show progress in the log as it happens
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/derivatives-market-data
          token: ${{ secrets.DATA_REPO_TOKEN }}  # fine-grained token, contents read/write on the data repo
          path: data-repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          # System libraries and fonts. Ubuntu's mirrors are sometimes unreachable from
          # GitHub runners; give up after 5 minutes and carry on, since the runner
          # image already has most of what headless Chromium needs.
          timeout 300 python -m playwright install-deps chromium || echo "::warning::System package install failed or timed out; continuing"

      - name: Scrape EEX
        run: python -m connectors.eex.scrape_eex
        env:
          EEX_CATALOG_ONLY: ${{ inputs.catalog_only && '1' || '' }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug/
          retention-days: 14

      - name: Commit new data
        if: always()
        run: .github/scripts/commit-data.sh "EEX settlements $(date -u +%F)"
