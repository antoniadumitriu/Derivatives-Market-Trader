name: EEX daily settlements

on:
  schedule:
    # 19:37 UTC (20:37 CET), Monday to Friday, after EEX publishes settlements.
    # GitHub cron runs in UTC and can start a few minutes late.
    - cron: "37 19 * * 1-5"
  workflow_dispatch: {}  # adds a "Run workflow" button for manual runs

permissions:
  contents: write  # lets the workflow commit the new data

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          # System libraries and fonts. Ubuntu's mirrors are sometimes unreachable from
          # GitHub runners; retry, then carry on, since the runner image already has
          # most of what headless Chromium needs.
          for i in 1 2 3; do python -m playwright install-deps chromium && break; sleep 30; done || true

      - name: Scrape EEX
        run: python -m connectors.eex.scrape_eex

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug/
          retention-days: 14

      - name: Commit new data
        if: always()
        run: .github/scripts/commit-data.sh "EEX settlements $(date -u +%F)"
